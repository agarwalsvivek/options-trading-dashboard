syntax = "proto3";

message OptionOrder {
  string orderId = 1;
  string underlying = 2;
  double price = 3;
  int64 quantity = 4;
  double delta = 5;
  uint64 timestamp = 6;
}

// Full order book, sent once per connection before any deltas.
message Snapshot {
  uint64 seq = 1;
  repeated OptionOrder orders = 2;
}

// Conflated full rows changed since the previous batch.
message DeltaBatch {
  uint64 seq = 1;
  repeated OptionOrder orders = 2;
}

// Liveness signal, sent every second regardless of market activity.
// `seq` is the latest batch seq, so clients can detect a missed batch.
message Heartbeat {
  uint64 seq = 1;
  uint64 serverTime = 2;
}

// User edit; only the edited field is set (presence-tracked, so 0 is a real value).
message Mutation {
  string orderId = 1;
  optional double price = 2;
  optional int64 quantity = 3;
  uint64 timestamp = 4;
  // Client-generated id echoed back in the MutationAck
  string requestId = 5;
}

// Reply to one Mutation, sent only to the client that made it. Sent after the edit is
// applied, so every batch that follows on the same socket already reflects it.
message MutationAck {
  string requestId = 1;
  bool accepted = 2;
  // Set when rejected
  string reason = 3;
  // Authoritative row after (or despite) the edit
  OptionOrder order = 4;
}

message ServerMessage {
  oneof body {
    Snapshot snapshot = 1;
    DeltaBatch deltas = 2;
    Heartbeat heartbeat = 3;
    MutationAck ack = 4;
  }
}

message ClientMessage {
  oneof body {
    Mutation mutation = 1;
  }
}
